name: Build Loop 3.2.1 (iOS15兼容版)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          repository: LoopKit/Loop
          ref: '3.2.1'       # 强制拉取官方历史标签 3.2.1
          submodules: recursive

      - name: Build
        run: |
          xcodebuild archive -workspace Loop.xcworkspace -scheme Loop -configuration Release -archivePath $RUNNER_TEMP/Loop.xcarchive
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/Loop.xcarchive -exportOptionsPlist exportOptions.plist -exportPath $RUNNER_TEMP/build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop-3.2.1-iOS15
          path: $RUNNER_TEMP/build/Loop.ipa
